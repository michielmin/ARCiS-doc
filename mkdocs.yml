site_name: ARCiS
site_description: ARtful modelling Code for exoplanet Science — documentation
site_author: Michiel Min
repo_url: https://github.com/michielmin/ARCiS
repo_name: michielmin/ARCiS
edit_uri: edit/master/docs/
copyright: Copyright &copy; Michiel Min and ARCiS contributors

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Tests: getting-started/tests.md
      - Quick start: getting-started/quickstart.md
      - Examples: getting-started/examples.md
  - User guide:
      - Input files: user-guide/input-files.md
      - Planet, star and grid: user-guide/planet-and-grid.md
      - Composition and chemistry: user-guide/chemistry.md
      - Temperature structure: user-guide/temperature.md
      - Clouds: user-guide/clouds.md
      - Opacities and radiative transfer: user-guide/radiative-transfer.md
      - Retrievals: user-guide/retrieval.md
      - 3D models and phase curves: user-guide/3d.md
      - Instrument simulation: user-guide/instrument-simulation.md
      - Output files: user-guide/output.md
      - Python interface: user-guide/python.md
  - Reference:
      - Keywords: reference/keywords.md
      - Molecules: reference/molecules.md
  - Theory notes:
      - Albedo iteration in 3D: theory/albedo-iteration.md
      - MCMC evidence: theory/mcmc-evidence.md
  - Developers:
      - Code structure: developer/code-structure.md
      - Writing documentation: developer/documentation.md
  - Citing ARCiS: citing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  scripts/
  reference/keywords.json
  reference/keyword_descriptions.yml
